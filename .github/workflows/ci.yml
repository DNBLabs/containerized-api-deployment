# Application quality gates for the weather tracer API (Phase Lock [1] / Task 20).
# Runs on push to main. Deploy, image scan, and Terraform
# workflows are added in later phases (Tasks 21–23).

name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

env:
  WEATHER_PROVIDER: mock
  UV_FROZEN: "true"

jobs:
  quality:
    name: App quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Bandit
        run: uv run bandit -r src/weather_api -q

      - name: Pytest
        run: uv run pytest -q
