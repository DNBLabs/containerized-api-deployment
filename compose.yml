# Local development stack for the weather tracer API (Task 13).
# Build context: app/ — see CONTEXT.md Phase Lock [2].

services:
  weather-api:
    image: weather-api:local
    build:
      context: ./app
    ports:
      - "8000:8000"
    environment:
      WEATHER_PROVIDER: mock
      ENABLE_HSTS: "false"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
